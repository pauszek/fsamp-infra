services:
  localstack:
    image: localstack/localstack-pro:4.14.0
    container_name: fsamp-localstack
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
      - "4510-4559:4510-4559"
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
      - AWS_DEFAULT_REGION=${AWS_REGION:-us-west-2}

      - SERVICES=s3,sqs,sns,dynamodb,kms,lambda,iam,sts,cloudwatch,logs,events,secretsmanager,ssm,apigateway,cognito-idp,ecs,ecr,cloudtrail,config,guardduty
      - EAGER_SERVICE_LOADING=1

      - ENFORCE_IAM=1
      - IAM_SOFT_MODE=0
      - LAMBDA_EXECUTOR=docker
      - DOCKER_HOST=unix:///var/run/docker.sock

      - PERSISTENCE=${PERSISTENCE:-1}
      - DEBUG=${DEBUG:-0}
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
      - ./localstack:/etc/localstack/init/ready.d
    networks:
      - fsamp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  localstack-data:
    name: fsamp-localstack-data

networks:
  fsamp-network:
    driver: bridge
    name: fsamp-network
