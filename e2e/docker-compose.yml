services:
  docker-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    container_name: fsamp-e2e-docker-proxy
    environment:
      CONTAINERS: 1
      DELETE: 1
      EXEC: 1
      IMAGES: 1
      INFO: 1
      NETWORKS: 1
      PING: 1
      POST: 1
      VERSION: 1
      VOLUMES: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - fsamp-e2e-network
    read_only: true
    tmpfs:
      - /run
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  localstack:
    image: localstack/localstack-pro@sha256:0d74e1d2d7ce13a3cb25fc64cf15eb225f1c95c762e56e057bc6a9ed0ed29306
    container_name: fsamp-e2e-localstack
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN}
      AWS_DEFAULT_REGION: us-west-2
      SERVICES: s3,sqs,sns,dynamodb,kms,cognito-idp,iam,sts,lambda,ecr,events,cloudwatch,logs,xray,cloudtrail,guardduty,config
      PERSISTENCE: 0
      DEBUG: ${LOCALSTACK_DEBUG:-0}
      ENABLE_AUDIT_SERVICES: ${ENABLE_AUDIT_SERVICES:-0}
      ENFORCE_IAM: 1
      DOCKER_HOST: tcp://docker-proxy:2375
      LOCALSTACK_HOST: localstack:4566
      LAMBDA_DOCKER_NETWORK: fsamp-e2e-network
    volumes:
      - ../localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
      - fsamp-config:/tmp/localstack-config
    networks:
      - fsamp-e2e-network
    depends_on:
      - docker-proxy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health && test -f /tmp/localstack-config/fsamp-config.env"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
  gateway:
    image: ${GATEWAY_IMAGE:-fsamp-gateway:e2e}
    container_name: fsamp-e2e-gateway
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-west-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_S3_ENDPOINT: http://localstack:4566
      AWS_SNS_ENDPOINT: http://localstack:4566
      S3_BUCKET_NAME: fsamp-local-files
      SNS_TOPIC_ARN: arn:aws:sns:us-west-2:000000000000:fsamp-local-file-events
      DIRECT_PUBLISH_AFTER_OUTBOX: "false"
      COGNITO_REGION: us-west-2
      COGNITO_RESOURCE_SERVER_IDENTIFIER: fsamp-api
      CONFIG_FILE: /config/fsamp-config.env
      CONFIG_WAIT_TIMEOUT: 120
    entrypoint: ["/entrypoint.sh"]
    volumes:
      - fsamp-config:/config:ro
    depends_on:
      localstack:
        condition: service_healthy
    networks:
      - fsamp-e2e-network
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s

  processor:
    image: ${PROCESSOR_IMAGE:-fsamp-processor:e2e}
    container_name: fsamp-e2e-processor
    environment:
      ENVIRONMENT: local
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-west-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      LOG_LEVEL: DEBUG
      SQS_QUEUE_URL: http://localstack:4566/000000000000/fsamp-local-processing-queue
      SNS_TOPIC_ARN: arn:aws:sns:us-west-2:000000000000:fsamp-local-file-events
      PROCESSING_EVENTS_TOPIC_ARN: arn:aws:sns:us-west-2:000000000000:fsamp-local-processing-events
      S3_BUCKET_NAME: fsamp-local-files
      DYNAMODB_TABLE_NAME: fsamp-local-file-metadata
      OUTBOX_TABLE_NAME: fsamp-local-outbox
      USE_FIPS_ENDPOINT: "false"
      FIPS_REQUIRED: "true"
    entrypoint: ["/bin/sh", "-c", "test -f /config/fsamp-config.env && . /config/fsamp-config.env; exec python -m processor.main"]
    volumes:
      - fsamp-config:/config:ro
    depends_on:
      localstack:
        condition: service_healthy
    networks:
      - fsamp-e2e-network
    healthcheck:
      test: ["CMD", "python", "-c", "from processor.infrastructure.fips import enforce_fips; enforce_fips(True)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  outbox-publisher:
    image: ${PROCESSOR_IMAGE:-fsamp-processor:e2e}
    container_name: fsamp-e2e-outbox-publisher
    environment:
      ENVIRONMENT: local
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-west-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      LOG_LEVEL: DEBUG
      FILE_EVENTS_TOPIC_ARN: arn:aws:sns:us-west-2:000000000000:fsamp-local-file-events
      PROCESSING_EVENTS_TOPIC_ARN: arn:aws:sns:us-west-2:000000000000:fsamp-local-processing-events
      OUTBOX_TABLE_NAME: fsamp-local-outbox
      OUTBOX_SHARD_COUNT: "16"
      USE_FIPS_ENDPOINT: "false"
      FIPS_REQUIRED: "true"
    entrypoint:
      - /bin/sh
      - -ec
      - while true; do python -c 'from processor.outbox_publisher import retry_pending_events; retry_pending_events()'; sleep 2; done
    depends_on:
      localstack:
        condition: service_healthy
    networks:
      - fsamp-e2e-network
    healthcheck:
      test: ["CMD", "python", "-c", "from processor.infrastructure.fips import enforce_fips; enforce_fips(True)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  e2e-tests:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    container_name: fsamp-e2e-tests
    environment:
      GATEWAY_URL: http://gateway:8080
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-west-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_BUCKET_NAME: fsamp-local-files
      DYNAMODB_TABLE_NAME: fsamp-local-file-metadata
      OUTBOX_TABLE_NAME: fsamp-local-outbox
      SQS_QUEUE_NAME: fsamp-local-processing-queue
      TEST_USER: e2e-test-user
      TEST_PASSWORD: E2eTestPass123!
      ADMIN_USER: e2e-admin-user
      ADMIN_PASSWORD: E2eAdminPass123!
    volumes:
      - fsamp-config:/config:ro
    depends_on:
      gateway:
        condition: service_healthy
      processor:
        condition: service_healthy
      outbox-publisher:
        condition: service_healthy
    networks:
      - fsamp-e2e-network
    profiles:
      - test
volumes:
  fsamp-config:
    name: fsamp-e2e-config
    driver: local
networks:
  fsamp-e2e-network:
    driver: bridge
    name: fsamp-e2e-network
