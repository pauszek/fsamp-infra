name: Update Compatibility Matrix

on:
  repository_dispatch:
    types: [update-compatibility]

  workflow_dispatch:
    inputs:
      service:
        description: 'Service name (gateway, processor, event-schema)'
        required: true
        type: choice
        options:
          - gateway
          - processor
          - event-schema
      version:
        description: 'New version (e.g., 1.2.3)'
        required: true
        type: string
      source_sha:
        description: 'Full commit SHA referenced by the release tag'
        required: true
        type: string

jobs:
  update-matrix:
    name: Update Compatibility Matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install yq
        env:
          YQ_VERSION: v4.45.4
          YQ_SHA256: b96de04645707e14a12f52c37e6266832e03c29e95b9b139cddcae7314466e69
        run: |
          set -euo pipefail
          destination="${RUNNER_TEMP}/yq"
          curl --fail --silent --show-error --location \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            --output "${destination}"
          echo "${YQ_SHA256}  ${destination}" | sha256sum --check --strict
          chmod 0755 "${destination}"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Determine service and version
        id: params
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SERVICE: ${{ github.event.client_payload.service || '' }}
          DISPATCH_VERSION: ${{ github.event.client_payload.version || '' }}
          DISPATCH_SOURCE_SHA: ${{ github.event.client_payload.source_sha || '' }}
          INPUT_SERVICE: ${{ inputs.service || '' }}
          INPUT_VERSION: ${{ inputs.version || '' }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha || '' }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "repository_dispatch" ]]; then
            SERVICE="${DISPATCH_SERVICE}"
            VERSION="${DISPATCH_VERSION}"
            SOURCE_SHA="${DISPATCH_SOURCE_SHA}"
          else
            SERVICE="${INPUT_SERVICE}"
            VERSION="${INPUT_VERSION}"
            SOURCE_SHA="${INPUT_SOURCE_SHA}"
          fi

          VERSION="${VERSION#v}"

          [[ "${SERVICE}" =~ ^(gateway|processor|event-schema)$ ]] || {
            echo "::error::Unsupported service"
            exit 1
          }
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Version must be stable semantic version x.y.z"
            exit 1
          }
          [[ "${SOURCE_SHA}" =~ ^[a-f0-9]{40}$ ]] || {
            echo "::error::A full source_sha is required"
            exit 1
          }

          repository="${GITHUB_REPOSITORY_OWNER}/fsamp-${SERVICE}"
          tag_refs="$(git ls-remote "https://github.com/${repository}.git" "refs/tags/v${VERSION}" "refs/tags/v${VERSION}^{}")"
          tag_sha="$(awk '/\^\{\}$/ {print $1}' <<< "${tag_refs}")"
          if [[ -z "${tag_sha}" ]]; then
            tag_sha="$(awk 'NR == 1 {print $1}' <<< "${tag_refs}")"
          fi
          [[ -n "${tag_sha}" && "${tag_sha}" == "${SOURCE_SHA}" ]] || {
            echo "::error::source_sha does not match ${repository} tag v${VERSION}"
            exit 1
          }

          {
            echo "service=${SERVICE}"
            echo "version=${VERSION}"
            echo "source_sha=${SOURCE_SHA}"
          } >> "$GITHUB_OUTPUT"
          echo "Updating ${SERVICE} to version ${VERSION}"

      - name: Update compatibility.yml
        env:
          SERVICE: ${{ steps.params.outputs.service }}
          VERSION: ${{ steps.params.outputs.version }}
        run: |
          COMPAT_FILE="compatibility.yml"

          echo "Current values:"
          yq '.current' "$COMPAT_FILE"

          yq -i '.current[strenv(SERVICE)] = strenv(VERSION)' "$COMPAT_FILE"

          echo ""
          echo "Updated values:"
          yq '.current' "$COMPAT_FILE"

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GABRBA_APPID }}
          private-key: ${{ secrets.GABRBA_SECRET }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore: update ${{ steps.params.outputs.service }} to ${{ steps.params.outputs.version }}"
          title: "Update compatibility: ${{ steps.params.outputs.service }} to ${{ steps.params.outputs.version }}"
          body: |

            This PR updates the compatibility matrix with the latest released version:

            | Service | Version |
            |---------|---------|
            | ${{ steps.params.outputs.service }} | ${{ steps.params.outputs.version }} |

            - Release tag commit: `${{ steps.params.outputs.source_sha }}`
            - The compatibility E2E matrix must pass before this PR can merge.
          branch: "compat-update/${{ steps.params.outputs.service }}-${{ steps.params.outputs.version }}"
          labels: |
            automerge
            compatibility
          delete-branch: true
