# =============================================================================
# Update Compatibility Matrix Action
# =============================================================================
# Updates the compatibility.yml file in fsamp-infra when a new version
# is released. Called via repository_dispatch from component repos.
#
# Usage (in component repo's tag-release job):
#   - name: Update compatibility matrix
#     uses: peter-evans/repository-dispatch@v3
#     with:
#       token: ${{ secrets.GABRBA_SECRET }}
#       repository: pauszek/fsamp-infra
#       event-type: update-compatibility
#       client-payload: '{"service": "gateway", "version": "1.2.3"}'
# =============================================================================
name: Update Compatibility Matrix

on:
  repository_dispatch:
    types: [update-compatibility]
  
  workflow_dispatch:
    inputs:
      service:
        description: 'Service name (gateway, processor, event-schema)'
        required: true
        type: choice
        options:
          - gateway
          - processor
          - event-schema
      version:
        description: 'New version (e.g., 1.2.3)'
        required: true
        type: string

jobs:
  update-matrix:
    name: 📋 Update Compatibility Matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Determine service and version
        id: params
        run: |
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            SERVICE="${{ github.event.client_payload.service }}"
            VERSION="${{ github.event.client_payload.version }}"
          else
            SERVICE="${{ inputs.service }}"
            VERSION="${{ inputs.version }}"
          fi
          
          # Remove 'v' prefix if present
          VERSION="${VERSION#v}"
          
          echo "service=${SERVICE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "📋 Updating ${SERVICE} to version ${VERSION}"

      - name: Update compatibility.yml
        env:
          SERVICE: ${{ steps.params.outputs.service }}
          VERSION: ${{ steps.params.outputs.version }}
        run: |
          COMPAT_FILE="compatibility.yml"
          
          echo "Current values:"
          yq '.current' "$COMPAT_FILE"
          
          # Update the version
          yq -i ".current.${SERVICE} = \"${VERSION}\"" "$COMPAT_FILE"
          
          echo ""
          echo "Updated values:"
          yq '.current' "$COMPAT_FILE"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update ${{ steps.params.outputs.service }} to ${{ steps.params.outputs.version }}"
          title: "🔄 Update compatibility: ${{ steps.params.outputs.service }} → ${{ steps.params.outputs.version }}"
          body: |
            ## Compatibility Matrix Update
            
            This PR updates the compatibility matrix with the latest released version:
            
            | Service | Version |
            |---------|---------|
            | ${{ steps.params.outputs.service }} | ${{ steps.params.outputs.version }} |
            
            ### What this means
            - E2E tests will now use `${{ steps.params.outputs.service }}:${{ steps.params.outputs.version }}` as the stable counterpart
            - This version has passed all CI checks and security scans
            
            ---
            _Auto-generated by the release pipeline._
          branch: "compat-update/${{ steps.params.outputs.service }}-${{ steps.params.outputs.version }}"
          labels: |
            automerge
            compatibility
          delete-branch: true
