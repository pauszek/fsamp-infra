name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy.yml
      - .github/workflows/deploy-environment.yml
      - scripts/**
      - terraform/**
  repository_dispatch:
    types:
      - deploy-dev
  workflow_dispatch:
    inputs:
      action:
        description: Deployment action
        required: true
        type: choice
        options:
          - promote
          - deploy-dev
          - rollback
        default: promote
      aws_region:
        description: AWS region
        required: true
        type: string
        default: us-west-2
      bootstrap_state:
        description: Create the S3 state bucket and DynamoDB lock table if missing
        required: true
        type: boolean
        default: true
      gateway_ref:
        description: fsamp-gateway git ref
        required: true
        type: string
        default: main
      processor_ref:
        description: fsamp-processor git ref
        required: true
        type: string
        default: main
      image_tag:
        description: Optional image tag. Empty value generates a run-scoped tag.
        required: false
        type: string
        default: ''
      rollback_environment:
        description: Environment to roll back
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: dev
      rollback_image_tag:
        description: Image tag to roll back to. Use previous for the last successful tag.
        required: true
        type: string
        default: previous

permissions:
  contents: read
  id-token: write

jobs:
  params:
    name: Load Deployment Settings
    runs-on: ubuntu-latest
    outputs:
      auto_deploy_dev: ${{ steps.params.outputs.auto_deploy_dev }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Load params
        id: params
        shell: bash
        run: |
          auto_deploy_dev="$(python3 - <<'PY'
          from pathlib import Path

          value = "false"
          section = None

          for raw in Path(".github/params.yml").read_text().splitlines():
              line = raw.split("#", 1)[0].rstrip()
              if not line.strip():
                  continue
              if not line.startswith((" ", "\t")) and line.endswith(":"):
                  section = line[:-1].strip()
                  continue
              if section == "deploy":
                  stripped = line.strip()
                  if stripped.startswith("auto-dev:"):
                      value = stripped.split(":", 1)[1].strip().strip("'\"").lower()
                      break

          print("true" if value == "true" else "false")
          PY
          )"
          echo "auto_deploy_dev=${auto_deploy_dev}" >> "$GITHUB_OUTPUT"

  context:
    name: Resolve Context
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.context.outputs.action }}
      aws_region: ${{ steps.context.outputs.aws_region }}
      bootstrap_state: ${{ steps.context.outputs.bootstrap_state }}
      gateway_ref: ${{ steps.context.outputs.gateway_ref }}
      image_tag: ${{ steps.context.outputs.image_tag }}
      processor_ref: ${{ steps.context.outputs.processor_ref }}
      rollback_environment: ${{ steps.context.outputs.rollback_environment }}
      rollback_image_tag: ${{ steps.context.outputs.rollback_image_tag }}
    steps:
      - name: Resolve context
        id: context
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ACTION: ${{ inputs.action || '' }}
          INPUT_AWS_REGION: ${{ inputs.aws_region || '' }}
          INPUT_BOOTSTRAP_STATE: ${{ toJSON(inputs.bootstrap_state) }}
          INPUT_GATEWAY_REF: ${{ inputs.gateway_ref || '' }}
          INPUT_PROCESSOR_REF: ${{ inputs.processor_ref || '' }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag || '' }}
          INPUT_ROLLBACK_ENVIRONMENT: ${{ inputs.rollback_environment || '' }}
          INPUT_ROLLBACK_IMAGE_TAG: ${{ inputs.rollback_image_tag || '' }}
          PAYLOAD_GATEWAY_REF: ${{ github.event.client_payload.gateway_ref || '' }}
          PAYLOAD_PROCESSOR_REF: ${{ github.event.client_payload.processor_ref || '' }}
          PAYLOAD_IMAGE_TAG: ${{ github.event.client_payload.image_tag || '' }}
          PAYLOAD_AWS_REGION: ${{ github.event.client_payload.aws_region || '' }}
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA::7}"
          action="${INPUT_ACTION:-deploy-dev}"
          aws_region="${INPUT_AWS_REGION:-${PAYLOAD_AWS_REGION:-us-west-2}}"
          case "${INPUT_BOOTSTRAP_STATE}" in
            true|false)
              bootstrap_state="${INPUT_BOOTSTRAP_STATE}"
              ;;
            *)
              bootstrap_state="true"
              ;;
          esac
          gateway_ref="${INPUT_GATEWAY_REF:-${PAYLOAD_GATEWAY_REF:-main}}"
          processor_ref="${INPUT_PROCESSOR_REF:-${PAYLOAD_PROCESSOR_REF:-main}}"
          rollback_environment="${INPUT_ROLLBACK_ENVIRONMENT:-dev}"
          rollback_image_tag="${INPUT_ROLLBACK_IMAGE_TAG:-previous}"

          if [[ "${EVENT_NAME}" == "push" || "${EVENT_NAME}" == "repository_dispatch" ]]; then
            action="deploy-dev"
            image_tag="${PAYLOAD_IMAGE_TAG:-dev-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${short_sha}}"
          elif [[ "${action}" == "rollback" ]]; then
            image_tag="${rollback_image_tag}"
          elif [[ -n "${INPUT_IMAGE_TAG}" ]]; then
            image_tag="${INPUT_IMAGE_TAG}"
          elif [[ "${action}" == "deploy-dev" ]]; then
            image_tag="dev-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${short_sha}"
          else
            image_tag="release-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${short_sha}"
          fi

          {
            echo "action=${action}"
            echo "aws_region=${aws_region}"
            echo "bootstrap_state=${bootstrap_state}"
            echo "gateway_ref=${gateway_ref}"
            echo "image_tag=${image_tag}"
            echo "processor_ref=${processor_ref}"
            echo "rollback_environment=${rollback_environment}"
            echo "rollback_image_tag=${rollback_image_tag}"
          } >> "$GITHUB_OUTPUT"

  deploy-dev:
    name: Deploy Dev
    needs:
      - context
      - params
    if: >
      (github.event_name == 'workflow_dispatch' || needs.params.outputs.auto_deploy_dev == 'true') &&
      (needs.context.outputs.action == 'deploy-dev' || needs.context.outputs.action == 'promote')
    uses: ./.github/workflows/deploy-environment.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      environment: dev
      aws_region: ${{ needs.context.outputs.aws_region }}
      terraform_action: apply
      bootstrap_state: ${{ needs.context.outputs.bootstrap_state == 'true' }}
      deploy_images: true
      gateway_ref: ${{ needs.context.outputs.gateway_ref }}
      processor_ref: ${{ needs.context.outputs.processor_ref }}
      image_tag: ${{ needs.context.outputs.image_tag }}

  deploy-staging:
    name: Deploy Staging
    needs:
      - context
      - deploy-dev
    if: needs.context.outputs.action == 'promote'
    uses: ./.github/workflows/deploy-environment.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      environment: staging
      aws_region: ${{ needs.context.outputs.aws_region }}
      terraform_action: apply
      bootstrap_state: ${{ needs.context.outputs.bootstrap_state == 'true' }}
      deploy_images: true
      gateway_ref: ${{ needs.context.outputs.gateway_ref }}
      processor_ref: ${{ needs.context.outputs.processor_ref }}
      image_tag: ${{ needs.context.outputs.image_tag }}

  deploy-prod:
    name: Deploy Prod
    needs:
      - context
      - deploy-staging
    if: needs.context.outputs.action == 'promote'
    uses: ./.github/workflows/deploy-environment.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      environment: prod
      aws_region: ${{ needs.context.outputs.aws_region }}
      terraform_action: apply
      bootstrap_state: ${{ needs.context.outputs.bootstrap_state == 'true' }}
      deploy_images: true
      gateway_ref: ${{ needs.context.outputs.gateway_ref }}
      processor_ref: ${{ needs.context.outputs.processor_ref }}
      image_tag: ${{ needs.context.outputs.image_tag }}

  rollback:
    name: Rollback
    needs: context
    if: needs.context.outputs.action == 'rollback'
    uses: ./.github/workflows/deploy-environment.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      environment: ${{ needs.context.outputs.rollback_environment }}
      aws_region: ${{ needs.context.outputs.aws_region }}
      terraform_action: apply
      bootstrap_state: false
      deploy_images: false
      gateway_ref: ${{ needs.context.outputs.gateway_ref }}
      processor_ref: ${{ needs.context.outputs.processor_ref }}
      image_tag: ${{ needs.context.outputs.image_tag }}
