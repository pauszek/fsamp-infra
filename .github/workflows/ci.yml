name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  drift-configuration:
    name: Test drift configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Test fail-closed drift activation
        run: bash scripts/test-validate-drift-config.sh

      - name: Test compatibility version semantics
        run: python3 scripts/test-compatibility-config.py

  terraform-contracts:
    name: Test Terraform contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.7.4"

      - name: Initialize test modules
        run: terraform init -backend=false

      - name: Test plan-time contracts
        run: terraform test

  e2e-compose:
    name: Validate E2E Compose
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Test fail-closed E2E runner
        run: |
          python -m venv "${RUNNER_TEMP}/fsamp-e2e-venv"
          source "${RUNNER_TEMP}/fsamp-e2e-venv/bin/activate"
          python -m pip install --require-hashes -r e2e/requirements.lock
          python -m unittest \
            e2e/test_run_e2e_tests.py \
            scripts/test_localstack_plan_check.py

      - name: Validate isolated infrastructure startup
        env:
          LOCALSTACK_AUTH_TOKEN: validation-only
        run: docker compose -f e2e/docker-compose.yml config --quiet

      - name: Test LocalStack Docker contracts
        env:
          LOCALSTACK_AUTH_TOKEN: validation-only
        run: python3 scripts/test-compose-contracts.py

  k6-contract:
    name: Test k6 API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Validate scenarios and exercise strict local API
        run: bash scripts/test-k6-scripts.sh

  call-terraform:
    needs: [drift-configuration, terraform-contracts, e2e-compose, k6-contract]
    uses: pauszek/fsamp-code-ci/.github/workflows/build-terraform.yml@3d3ae3dcef70ca1829e285c8e76f22f89cd54994
    secrets:
      GABRBA_SECRET: ${{ secrets.GABRBA_SECRET }}
