name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  e2e-compose:
    name: Validate E2E Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Validate isolated infrastructure startup
        env:
          LOCALSTACK_AUTH_TOKEN: validation-only
        run: docker compose -f e2e/docker-compose.yml config --quiet

  call-terraform:
    needs: e2e-compose
    uses: pauszek/fsamp-code-ci/.github/workflows/build-terraform.yml@3be5121f484722007182b432327f9a6a27d32458
    secrets:
      GABRBA_SECRET: ${{ secrets.GABRBA_SECRET }}
