name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  call-terraform:
    uses: pauszek/fsamp-code-ci/.github/workflows/build-terraform.yml@v0.0.48
    secrets:
      GABRBA_SECRET: ${{ secrets.GABRBA_SECRET }}
