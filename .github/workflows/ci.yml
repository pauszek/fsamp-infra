name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  e2e-compose:
    name: Validate E2E Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate isolated infrastructure startup
        env:
          LOCALSTACK_AUTH_TOKEN: validation-only
        run: docker compose -f e2e/docker-compose.yml config --quiet

  call-terraform:
    needs: e2e-compose
    uses: pauszek/fsamp-code-ci/.github/workflows/build-terraform.yml@3409376a2811efe661ea848bd6b750fbddcbd2fb
    secrets:
      GABRBA_SECRET: ${{ secrets.GABRBA_SECRET }}
