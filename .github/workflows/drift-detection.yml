name: Drift Detection

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Override: run drift detection for a single environment'
        type: choice
        required: false
        default: 'all'
        options:
          - all
          - dev
          - staging
          - prod

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  configuration:
    name: Check drift configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Validate activation flag and account IDs
        id: check
        env:
          DRIFT_DETECTION_ENABLED: ${{ vars.DRIFT_DETECTION_ENABLED }}
          AWS_ACCOUNT_ID_DEV: ${{ vars.AWS_ACCOUNT_ID_DEV }}
          AWS_ACCOUNT_ID_STAGING: ${{ vars.AWS_ACCOUNT_ID_STAGING }}
          AWS_ACCOUNT_ID_PROD: ${{ vars.AWS_ACCOUNT_ID_PROD }}
          AWS_DRIFT_ROLE_ARN_DEV: ${{ secrets.AWS_DRIFT_ROLE_ARN_DEV }}
          AWS_DRIFT_ROLE_ARN_STAGING: ${{ secrets.AWS_DRIFT_ROLE_ARN_STAGING }}
          AWS_DRIFT_ROLE_ARN_PROD: ${{ secrets.AWS_DRIFT_ROLE_ARN_PROD }}
        run: bash scripts/validate-drift-config.sh

  dev:
    needs: configuration
    if: needs.configuration.outputs.enabled == 'true' && (github.event_name == 'schedule' || github.event.inputs.environment == 'all' || github.event.inputs.environment == 'dev')
    uses: pauszek/fsamp-code-ci/.github/workflows/drift-detection.yml@89267d679def9b6d5f773a0f4cd76fef19c1683d
    with:
      environment: dev
      aws_region: us-west-2
      backend_bucket: fsamp-dev-${{ vars.AWS_ACCOUNT_ID_DEV }}-us-west-2-tfstate
      backend_dynamodb_table: fsamp-dev-terraform-locks
      backend_key: dev/terraform.tfstate
      tfvars_file: envs/dev.tfvars
    secrets:
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DRIFT_ROLE_ARN_DEV }}

  staging:
    needs: configuration
    if: needs.configuration.outputs.enabled == 'true' && (github.event_name == 'schedule' || github.event.inputs.environment == 'all' || github.event.inputs.environment == 'staging')
    uses: pauszek/fsamp-code-ci/.github/workflows/drift-detection.yml@89267d679def9b6d5f773a0f4cd76fef19c1683d
    with:
      environment: staging
      aws_region: us-west-2
      backend_bucket: fsamp-staging-${{ vars.AWS_ACCOUNT_ID_STAGING }}-us-west-2-tfstate
      backend_dynamodb_table: fsamp-staging-terraform-locks
      backend_key: staging/terraform.tfstate
      tfvars_file: envs/staging.tfvars
    secrets:
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DRIFT_ROLE_ARN_STAGING }}

  prod:
    needs: configuration
    if: needs.configuration.outputs.enabled == 'true' && (github.event_name == 'schedule' || github.event.inputs.environment == 'all' || github.event.inputs.environment == 'prod')
    uses: pauszek/fsamp-code-ci/.github/workflows/drift-detection.yml@89267d679def9b6d5f773a0f4cd76fef19c1683d
    with:
      environment: prod
      aws_region: us-west-2
      backend_bucket: fsamp-prod-${{ vars.AWS_ACCOUNT_ID_PROD }}-us-west-2-tfstate
      backend_dynamodb_table: fsamp-prod-terraform-locks
      backend_key: prod/terraform.tfstate
      tfvars_file: envs/prod.tfvars
    secrets:
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DRIFT_ROLE_ARN_PROD }}
