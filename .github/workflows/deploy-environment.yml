name: Deploy Environment

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment
        required: true
        type: string
      aws_region:
        description: AWS region
        required: false
        type: string
        default: us-west-2
      terraform_action:
        description: plan-only or apply
        required: false
        type: string
        default: plan-only
      bootstrap_state:
        description: Create the state bucket and lock table during apply
        required: false
        type: boolean
        default: true
      gateway_source_image:
        description: CI-produced gateway image as ghcr.io/<owner>/fsamp-gateway@sha256:<digest>; empty reuses current
        required: false
        type: string
        default: ''
      processor_source_image:
        description: CI-produced processor image as ghcr.io/<owner>/fsamp-processor@sha256:<digest>; empty reuses current
        required: false
        type: string
        default: ''
      code_ci_workflow_sha:
        description: Full immutable fsamp-code-ci commit SHA used as the reusable workflow ref; empty reuses current
        required: false
        type: string
        default: ''
      image_tag:
        description: Immutable destination tag; use previous for rollback or current to redeploy
        required: false
        type: string
        default: ''

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  packages: read

env:
  TF_DIR: terraform
  TF_VERSION: 1.7.4

jobs:
  deploy:
    name: ${{ inputs.terraform_action == 'apply' && 'Apply' || 'Plan' }} ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TF_VAR_alarm_notification_endpoint: ${{ secrets.ALARM_NOTIFICATION_ENDPOINT }}
      TF_VAR_alarm_notification_protocol: ${{ vars.ALARM_NOTIFICATION_PROTOCOL || 'email' }}
      TF_VAR_alb_certificate_mode: ${{ vars.ALB_CERTIFICATE_MODE || (inputs.environment == 'dev' && 'self-signed' || 'acm') }}
      TF_VAR_alb_domain_name: ${{ vars.ALB_DOMAIN_NAME || '' }}
      TF_VAR_cognito_callback_urls: ${{ vars.COGNITO_CALLBACK_URLS_JSON || '[]' }}
      TF_VAR_cognito_logout_urls: ${{ vars.COGNITO_LOGOUT_URLS_JSON || '[]' }}
      TRUSTED_CODE_CI_WORKFLOW_SHA: ${{ vars.TRUSTED_CODE_CI_WORKFLOW_SHA || 'fd553ff9598c1d8548cb808b15b967c1610ccfc4' }}
    steps:
      - name: Validate inputs
        shell: bash
        env:
          ACTION: ${{ inputs.terraform_action }}
          ENVIRONMENT: ${{ inputs.environment }}
          AWS_REGION: ${{ inputs.aws_region }}
        run: |
          set -euo pipefail
          [[ "${ACTION}" =~ ^(plan-only|apply)$ ]] || {
            echo "::error::terraform_action must be plan-only or apply"
            exit 1
          }
          [[ "${ENVIRONMENT}" =~ ^(dev|staging|prod)$ ]] || {
            echo "::error::environment must be dev, staging, or prod"
            exit 1
          }
          [[ "${AWS_REGION}" == "us-west-2" ]] || {
            echo "::error::FSAMP deployments are restricted to us-west-2"
            exit 1
          }

      - name: Checkout infrastructure
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Configure environment-scoped AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ inputs.terraform_action == 'apply' && vars.AWS_APPLY_ROLE_ARN || vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: fsamp-${{ inputs.terraform_action }}-${{ inputs.environment }}
          aws-region: ${{ inputs.aws_region }}

      - name: Resolve deployment context
        id: context
        shell: bash
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          AWS_REGION: ${{ inputs.aws_region }}
          INPUT_TAG: ${{ inputs.image_tag }}
          INPUT_GATEWAY_IMAGE: ${{ inputs.gateway_source_image }}
          INPUT_PROCESSOR_IMAGE: ${{ inputs.processor_source_image }}
          INPUT_CODE_CI_SHA: ${{ inputs.code_ci_workflow_sha }}
        run: |
          set -euo pipefail

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          state_bucket="fsamp-${ENVIRONMENT}-${account_id}-${AWS_REGION}-tfstate"
          state_key="${ENVIRONMENT}/terraform.tfstate"
          lock_table="fsamp-${ENVIRONMENT}-terraform-locks"
          image_tag="${INPUT_TAG}"
          gateway_source_image="${INPUT_GATEWAY_IMAGE}"
          processor_source_image="${INPUT_PROCESSOR_IMAGE}"
          code_ci_workflow_sha="${INPUT_CODE_CI_SHA}"

          read_parameter() {
            aws ssm get-parameter --name "$1" --query Parameter.Value --output text 2>/dev/null || true
          }

          if [[ "${image_tag}" == "previous" ]]; then
            image_tag="$(read_parameter "/fsamp/${ENVIRONMENT}/deployment/previous_image_tag")"
            gateway_source_image="$(read_parameter "/fsamp/${ENVIRONMENT}/deployment/previous_gateway_source_image")"
            processor_source_image="$(read_parameter "/fsamp/${ENVIRONMENT}/deployment/previous_processor_source_image")"
            code_ci_workflow_sha="$(read_parameter "/fsamp/${ENVIRONMENT}/deployment/previous_code_ci_workflow_sha")"
          else
            if [[ "${image_tag}" == "current" || -z "${image_tag}" ]]; then
              current_tag="$(read_parameter "/fsamp/${ENVIRONMENT}/deployment/current_image_tag")"
              if [[ "${image_tag}" == "current" ]] || [[ -z "${gateway_source_image}" && -z "${processor_source_image}" ]]; then
                image_tag="${current_tag}"
              fi
            fi
            if [[ -z "${gateway_source_image}" ]]; then
              gateway_source_image="$(read_parameter "/fsamp/${ENVIRONMENT}/deployment/current_gateway_source_image")"
            fi
            if [[ -z "${processor_source_image}" ]]; then
              processor_source_image="$(read_parameter "/fsamp/${ENVIRONMENT}/deployment/current_processor_source_image")"
            fi
            if [[ -z "${code_ci_workflow_sha}" ]]; then
              code_ci_workflow_sha="$(read_parameter "/fsamp/${ENVIRONMENT}/deployment/current_code_ci_workflow_sha")"
            fi
          fi

          if [[ -z "${image_tag}" || "${image_tag}" == "None" ]]; then
            image_tag="deploy-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA::7}"
          fi

          [[ "${image_tag}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || {
            echo "::error::Invalid destination image tag"
            exit 1
          }
          [[ "${gateway_source_image}" =~ ^ghcr\.io/${GITHUB_REPOSITORY_OWNER}/fsamp-gateway@sha256:[a-f0-9]{64}$ ]] || {
            echo "::error::A digest-pinned CI gateway_source_image is required"
            exit 1
          }
          [[ "${processor_source_image}" =~ ^ghcr\.io/${GITHUB_REPOSITORY_OWNER}/fsamp-processor@sha256:[a-f0-9]{64}$ ]] || {
            echo "::error::A digest-pinned CI processor_source_image is required"
            exit 1
          }
          [[ "${code_ci_workflow_sha}" =~ ^[a-f0-9]{40}$ ]] || {
            echo "::error::A full immutable code_ci_workflow_sha is required"
            exit 1
          }
          [[ "${code_ci_workflow_sha}" == "${TRUSTED_CODE_CI_WORKFLOW_SHA}" ]] || {
            echo "::error::code_ci_workflow_sha is not trusted for this environment"
            exit 1
          }

          {
            echo "account_id=${account_id}"
            echo "state_bucket=${state_bucket}"
            echo "state_key=${state_key}"
            echo "lock_table=${lock_table}"
            echo "image_tag=${image_tag}"
            echo "gateway_source_image=${gateway_source_image}"
            echo "processor_source_image=${processor_source_image}"
            echo "gateway_source_digest=${gateway_source_image##*@}"
            echo "processor_source_digest=${processor_source_image##*@}"
            echo "code_ci_workflow_sha=${code_ci_workflow_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Bootstrap encrypted Terraform state
        if: inputs.terraform_action == 'apply' && inputs.bootstrap_state
        shell: bash
        env:
          AWS_REGION: ${{ inputs.aws_region }}
          STATE_BUCKET: ${{ steps.context.outputs.state_bucket }}
          LOCK_TABLE: ${{ steps.context.outputs.lock_table }}
        run: |
          set -euo pipefail

          if ! aws s3api head-bucket --bucket "${STATE_BUCKET}" >/dev/null 2>&1; then
            aws s3api create-bucket \
              --bucket "${STATE_BUCKET}" \
              --create-bucket-configuration "LocationConstraint=${AWS_REGION}"
          fi

          aws s3api put-public-access-block \
            --bucket "${STATE_BUCKET}" \
            --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          aws s3api put-bucket-ownership-controls \
            --bucket "${STATE_BUCKET}" \
            --ownership-controls '{"Rules":[{"ObjectOwnership":"BucketOwnerEnforced"}]}'
          aws s3api put-bucket-versioning \
            --bucket "${STATE_BUCKET}" \
            --versioning-configuration Status=Enabled
          aws s3api put-bucket-encryption \
            --bucket "${STATE_BUCKET}" \
            --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"aws:kms"},"BucketKeyEnabled":true}]}'
          aws s3api put-bucket-lifecycle-configuration \
            --bucket "${STATE_BUCKET}" \
            --lifecycle-configuration '{"Rules":[{"ID":"state-history-retention","Status":"Enabled","Filter":{},"NoncurrentVersionExpiration":{"NoncurrentDays":365},"AbortIncompleteMultipartUpload":{"DaysAfterInitiation":7}}]}'

          policy_file="${RUNNER_TEMP}/state-policy.json"
          jq -n --arg bucket "${STATE_BUCKET}" '{
            Version: "2012-10-17",
            Statement: [
              {
                Sid: "DenyInsecureTransport",
                Effect: "Deny",
                Principal: "*",
                Action: "s3:*",
                Resource: [("arn:aws:s3:::" + $bucket), ("arn:aws:s3:::" + $bucket + "/*")],
                Condition: {Bool: {"aws:SecureTransport": "false"}}
              },
              {
                Sid: "DenyOutdatedTLS",
                Effect: "Deny",
                Principal: "*",
                Action: "s3:*",
                Resource: [("arn:aws:s3:::" + $bucket), ("arn:aws:s3:::" + $bucket + "/*")],
                Condition: {NumericLessThan: {"s3:TlsVersion": 1.2}}
              }
            ]
          }' > "${policy_file}"
          aws s3api put-bucket-policy --bucket "${STATE_BUCKET}" --policy "file://${policy_file}"

          if ! aws dynamodb describe-table --table-name "${LOCK_TABLE}" >/dev/null 2>&1; then
            aws dynamodb create-table \
              --table-name "${LOCK_TABLE}" \
              --billing-mode PAY_PER_REQUEST \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --tags Key=Project,Value=fsamp Key=Environment,Value=${{ inputs.environment }}
          fi
          aws dynamodb wait table-exists --table-name "${LOCK_TABLE}"
          aws dynamodb update-table \
            --table-name "${LOCK_TABLE}" \
            --sse-specification Enabled=true,SSEType=KMS >/dev/null
          aws dynamodb wait table-exists --table-name "${LOCK_TABLE}"
          aws dynamodb update-continuous-backups \
            --table-name "${LOCK_TABLE}" \
            --point-in-time-recovery-specification PointInTimeRecoveryEnabled=true >/dev/null

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init and format check
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform fmt -check -recursive
          terraform init \
            -backend-config="bucket=${{ steps.context.outputs.state_bucket }}" \
            -backend-config="key=${{ steps.context.outputs.state_key }}" \
            -backend-config="region=${{ inputs.aws_region }}" \
            -backend-config="dynamodb_table=${{ steps.context.outputs.lock_table }}" \
            -backend-config="encrypt=true"

      - name: Bootstrap ECR repositories before artifact promotion
        if: inputs.terraform_action == 'apply'
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform apply \
            -target=module.security \
            -target=module.ecr \
            -var-file="envs/${{ inputs.environment }}.tfvars" \
            -var="aws_region=${{ inputs.aws_region }}" \
            -var="gateway_image_tag=${{ steps.context.outputs.image_tag }}" \
            -var="processor_image_tag=${{ steps.context.outputs.image_tag }}" \
            -var="gateway_image_digest=${{ steps.context.outputs.gateway_source_digest }}" \
            -var="processor_image_digest=${{ steps.context.outputs.processor_source_digest }}" \
            -input=false \
            -lock-timeout=5m \
            -auto-approve

      - name: Resolve destination ECR repositories
        id: ecr
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          repositories="$(terraform output -json ecr_repository_urls)"
          gateway="$(jq -r '.gateway' <<< "${repositories}")"
          processor="$(jq -r '.processor' <<< "${repositories}")"
          [[ "${gateway}" != "null" && "${processor}" != "null" ]] || {
            echo "::error::ECR repositories do not exist; apply once with bootstrap enabled"
            exit 1
          }
          echo "gateway=${gateway}" >> "${GITHUB_OUTPUT}"
          echo "processor=${processor}" >> "${GITHUB_OUTPUT}"

      - name: Login to GHCR
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Login to ECR
        if: inputs.terraform_action == 'apply'
        shell: bash
        run: |
          aws ecr get-login-password --region "${{ inputs.aws_region }}" \
            | docker login --username AWS --password-stdin "${{ steps.context.outputs.account_id }}.dkr.ecr.${{ inputs.aws_region }}.amazonaws.com"

      - name: Set up Docker Buildx
        if: inputs.terraform_action == 'apply'
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Verify exact CI identities and signed SBOM attestations
        shell: bash
        env:
          GATEWAY_IMAGE: ${{ steps.context.outputs.gateway_source_image }}
          PROCESSOR_IMAGE: ${{ steps.context.outputs.processor_source_image }}
          CODE_CI_SHA: ${{ steps.context.outputs.code_ci_workflow_sha }}
        run: |
          set -euo pipefail
          issuer="https://token.actions.githubusercontent.com"
          gateway_identity="https://github.com/${GITHUB_REPOSITORY_OWNER}/fsamp-code-ci/.github/workflows/build-java.yml@${CODE_CI_SHA}"
          processor_identity="https://github.com/${GITHUB_REPOSITORY_OWNER}/fsamp-code-ci/.github/workflows/build-python.yml@${CODE_CI_SHA}"

          cosign verify \
            --certificate-identity "${gateway_identity}" \
            --certificate-oidc-issuer "${issuer}" \
            "${GATEWAY_IMAGE}" >/dev/null
          cosign verify-attestation \
            --type cyclonedx \
            --certificate-identity "${gateway_identity}" \
            --certificate-oidc-issuer "${issuer}" \
            "${GATEWAY_IMAGE}" >/dev/null

          cosign verify \
            --certificate-identity "${processor_identity}" \
            --certificate-oidc-issuer "${issuer}" \
            "${PROCESSOR_IMAGE}" >/dev/null
          cosign verify-attestation \
            --type cyclonedx \
            --certificate-identity "${processor_identity}" \
            --certificate-oidc-issuer "${issuer}" \
            "${PROCESSOR_IMAGE}" >/dev/null

      - name: Promote verified artifacts without rebuilding or re-signing
        if: inputs.terraform_action == 'apply'
        id: promote
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.context.outputs.image_tag }}
          GATEWAY_SOURCE: ${{ steps.context.outputs.gateway_source_image }}
          PROCESSOR_SOURCE: ${{ steps.context.outputs.processor_source_image }}
          GATEWAY_DESTINATION: ${{ steps.ecr.outputs.gateway }}
          PROCESSOR_DESTINATION: ${{ steps.ecr.outputs.processor }}
        run: |
          set -euo pipefail

          promote() {
            local source_image="$1"
            local destination="$2"
            local source_digest="${source_image##*@}"
            local repository_name="${destination##*/}"
            local existing_digest
            existing_digest="$(aws ecr describe-images \
              --repository-name "${repository_name}" \
              --image-ids "imageTag=${IMAGE_TAG}" \
              --query 'imageDetails[0].imageDigest' \
              --output text 2>/dev/null || true)"

            if [[ -n "${existing_digest}" && "${existing_digest}" != "None" ]]; then
              [[ "${existing_digest}" == "${source_digest}" ]] || {
                echo "::error::Immutable tag ${destination}:${IMAGE_TAG} already points to a different digest"
                exit 1
              }
            else
              docker buildx imagetools create --tag "${destination}:${IMAGE_TAG}" "${source_image}"
            fi

            local destination_digest
            destination_digest="$(aws ecr describe-images \
              --repository-name "${repository_name}" \
              --image-ids "imageTag=${IMAGE_TAG}" \
              --query 'imageDetails[0].imageDigest' \
              --output text)"
            [[ "${destination_digest}" == "${source_digest}" ]] || {
              echo "::error::Promotion changed the manifest digest for ${destination}"
              exit 1
            }
            printf '%s' "${destination_digest}"
          }

          gateway_digest="$(promote "${GATEWAY_SOURCE}" "${GATEWAY_DESTINATION}")"
          processor_digest="$(promote "${PROCESSOR_SOURCE}" "${PROCESSOR_DESTINATION}")"
          echo "gateway_digest=${gateway_digest}" >> "${GITHUB_OUTPUT}"
          echo "processor_digest=${processor_digest}" >> "${GITHUB_OUTPUT}"

      - name: Resolve existing destination digests for plan-only
        if: inputs.terraform_action == 'plan-only'
        id: existing
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.context.outputs.image_tag }}
          GATEWAY_DESTINATION: ${{ steps.ecr.outputs.gateway }}
          PROCESSOR_DESTINATION: ${{ steps.ecr.outputs.processor }}
          EXPECTED_GATEWAY_DIGEST: ${{ steps.context.outputs.gateway_source_digest }}
          EXPECTED_PROCESSOR_DIGEST: ${{ steps.context.outputs.processor_source_digest }}
        run: |
          set -euo pipefail
          resolve() {
            local destination="$1"
            local expected="$2"
            local repository_name="${destination##*/}"
            local digest
            digest="$(aws ecr describe-images --repository-name "${repository_name}" --image-ids "imageTag=${IMAGE_TAG}" --query 'imageDetails[0].imageDigest' --output text)"
            [[ "${digest}" == "${expected}" ]] || {
              echo "::error::Destination image does not match the verified source artifact"
              exit 1
            }
            printf '%s' "${digest}"
          }
          echo "gateway_digest=$(resolve "${GATEWAY_DESTINATION}" "${EXPECTED_GATEWAY_DIGEST}")" >> "${GITHUB_OUTPUT}"
          echo "processor_digest=$(resolve "${PROCESSOR_DESTINATION}" "${EXPECTED_PROCESSOR_DIGEST}")" >> "${GITHUB_OUTPUT}"

      - name: Terraform plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        env:
          GATEWAY_DIGEST: ${{ steps.promote.outputs.gateway_digest || steps.existing.outputs.gateway_digest }}
          PROCESSOR_DIGEST: ${{ steps.promote.outputs.processor_digest || steps.existing.outputs.processor_digest }}
        run: |
          set +e
          terraform plan \
            -var-file="envs/${{ inputs.environment }}.tfvars" \
            -var="aws_region=${{ inputs.aws_region }}" \
            -var="gateway_image_tag=${{ steps.context.outputs.image_tag }}" \
            -var="processor_image_tag=${{ steps.context.outputs.image_tag }}" \
            -var="gateway_image_digest=${GATEWAY_DIGEST}" \
            -var="processor_image_digest=${PROCESSOR_DIGEST}" \
            -input=false \
            -lock-timeout=5m \
            -detailed-exitcode \
            -out=tfplan
          exit_code=$?
          set -e

          if [[ "${exit_code}" -eq 0 ]]; then
            echo "has_changes=false" >> "${GITHUB_OUTPUT}"
          elif [[ "${exit_code}" -eq 2 ]]; then
            echo "has_changes=true" >> "${GITHUB_OUTPUT}"
          else
            exit "${exit_code}"
          fi

          terraform show -json tfplan \
            | jq -r '[.resource_changes[]?.change.actions | join("/")] | group_by(.) | map({action: .[0], count: length})' \
            > "${RUNNER_TEMP}/plan-summary.json"

      - name: Apply the reviewed in-job plan
        if: inputs.terraform_action == 'apply' && steps.plan.outputs.has_changes == 'true'
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve -input=false tfplan

      - name: Verify runtime readiness
        if: inputs.terraform_action == 'apply'
        working-directory: ${{ env.TF_DIR }}
        run: |
          cluster="$(terraform output -raw ecs_cluster_name)"
          service="$(terraform output -raw gateway_service_name)"
          processor="$(terraform output -raw processor_lambda_name)"
          outbox="$(terraform output -raw outbox_publisher_lambda_name)"
          retry="$(terraform output -raw outbox_retry_lambda_name)"

          aws ecs wait services-stable --cluster "${cluster}" --services "${service}"
          for function_name in "${processor}" "${outbox}" "${retry}"; do
            aws lambda wait function-active-v2 --function-name "${function_name}"
          done

          api_url="$(terraform output -raw api_gateway_endpoint)"
          curl --fail --show-error --silent --retry 6 --retry-all-errors --retry-delay 10 "${api_url}/health" >/dev/null

      - name: Record deployment manifest
        if: inputs.terraform_action == 'apply' && success()
        shell: bash
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_TAG: ${{ steps.context.outputs.image_tag }}
          GATEWAY_SOURCE: ${{ steps.context.outputs.gateway_source_image }}
          PROCESSOR_SOURCE: ${{ steps.context.outputs.processor_source_image }}
          GATEWAY_DIGEST: ${{ steps.promote.outputs.gateway_digest }}
          PROCESSOR_DIGEST: ${{ steps.promote.outputs.processor_digest }}
          CODE_CI_SHA: ${{ steps.context.outputs.code_ci_workflow_sha }}
        run: |
          set -euo pipefail
          get_current() {
            aws ssm get-parameter --name "$1" --query Parameter.Value --output text 2>/dev/null || true
          }
          promote_parameter() {
            local suffix="$1"
            local new_value="$2"
            local current_name="/fsamp/${ENVIRONMENT}/deployment/current_${suffix}"
            local previous_name="/fsamp/${ENVIRONMENT}/deployment/previous_${suffix}"
            local current_value
            current_value="$(get_current "${current_name}")"
            if [[ -n "${current_value}" && "${current_value}" != "None" ]]; then
              aws ssm put-parameter --name "${previous_name}" --type String --value "${current_value}" --overwrite >/dev/null
            fi
            aws ssm put-parameter --name "${current_name}" --type String --value "${new_value}" --overwrite >/dev/null
          }

          promote_parameter image_tag "${IMAGE_TAG}"
          promote_parameter gateway_source_image "${GATEWAY_SOURCE}"
          promote_parameter processor_source_image "${PROCESSOR_SOURCE}"
          promote_parameter gateway_digest "${GATEWAY_DIGEST}"
          promote_parameter processor_digest "${PROCESSOR_DIGEST}"
          promote_parameter code_ci_workflow_sha "${CODE_CI_SHA}"

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ${{ inputs.environment }} deployment"
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Action | \`${{ inputs.terraform_action }}\` |"
            echo "| Destination tag | \`${{ steps.context.outputs.image_tag }}\` |"
            echo "| Gateway source | \`${{ steps.context.outputs.gateway_source_image }}\` |"
            echo "| Processor source | \`${{ steps.context.outputs.processor_source_image }}\` |"
            echo "| Terraform changes | \`${{ steps.plan.outputs.has_changes || 'unknown' }}\` |"
            echo ""
            echo '```json'
            cat "${RUNNER_TEMP}/plan-summary.json" 2>/dev/null || echo '[]'
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
