name: Deploy Environment

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment
        required: true
        type: string
      aws_region:
        description: AWS region
        required: false
        type: string
        default: us-west-2
      terraform_action:
        description: Terraform action
        required: false
        type: string
        default: plan-only
      bootstrap_state:
        description: Create the S3 state bucket and DynamoDB lock table if missing
        required: false
        type: boolean
        default: true
      deploy_images:
        description: Build gateway and processor images and push them to ECR before apply
        required: false
        type: boolean
        default: true
      gateway_ref:
        description: fsamp-gateway git ref
        required: false
        type: string
        default: main
      processor_ref:
        description: fsamp-processor git ref
        required: false
        type: string
        default: main
      image_tag:
        description: Image tag to deploy. Use previous for rollback.
        required: false
        type: string
        default: ''

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  TF_DIR: terraform
  TF_VERSION: 1.7.4

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      account_id: ${{ steps.context.outputs.account_id }}
      image_tag: ${{ steps.context.outputs.image_tag }}
      lock_table: ${{ steps.context.outputs.lock_table }}
      partition: ${{ steps.context.outputs.partition }}
      state_bucket: ${{ steps.context.outputs.state_bucket }}
      state_key: ${{ steps.context.outputs.state_key }}
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Validate deployment region
        shell: bash
        env:
          AWS_REGION: ${{ inputs.aws_region }}
        run: |
          set -euo pipefail

          if [[ "${AWS_REGION}" != "us-west-2" ]]; then
            echo "::error::FSAMP deployments are restricted to us-west-2. Requested: ${AWS_REGION}"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Resolve deployment context
        id: context
        shell: bash
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          ENVIRONMENT: ${{ inputs.environment }}
          AWS_REGION: ${{ inputs.aws_region }}
        run: |
          set -euo pipefail

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          partition="$(aws sts get-caller-identity --query Arn --output text | cut -d: -f2)"
          short_sha="${GITHUB_SHA::7}"

          if [[ "${INPUT_IMAGE_TAG}" == "previous" ]]; then
            parameter_name="/fsamp/${ENVIRONMENT}/deployment/previous_image_tag"
            image_tag="$(aws ssm get-parameter \
              --name "${parameter_name}" \
              --query Parameter.Value \
              --output text 2>/dev/null || true)"

            if [[ -z "${image_tag}" || "${image_tag}" == "None" ]]; then
              echo "No previous deployment tag found in ${parameter_name}."
              exit 1
            fi
          elif [[ -n "${INPUT_IMAGE_TAG}" ]]; then
            image_tag="${INPUT_IMAGE_TAG}"
          else
            image_tag="deploy-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${short_sha}"
          fi

          {
            echo "account_id=${account_id}"
            echo "image_tag=${image_tag}"
            echo "state_bucket=fsamp-${ENVIRONMENT}-${account_id}-${AWS_REGION}-tfstate"
            echo "state_key=${ENVIRONMENT}/terraform.tfstate"
            echo "lock_table=fsamp-${ENVIRONMENT}-terraform-locks"
            echo "partition=${partition}"
          } >> "$GITHUB_OUTPUT"

      - name: Bootstrap Terraform state
        if: inputs.bootstrap_state
        shell: bash
        env:
          AWS_REGION: ${{ inputs.aws_region }}
          STATE_BUCKET: ${{ steps.context.outputs.state_bucket }}
          LOCK_TABLE: ${{ steps.context.outputs.lock_table }}
          PARTITION: ${{ steps.context.outputs.partition }}
        run: |
          set -euo pipefail

          if ! aws s3api head-bucket --bucket "${STATE_BUCKET}" >/dev/null 2>&1; then
            if [[ "${AWS_REGION}" == "us-east-1" ]]; then
              aws s3api create-bucket --bucket "${STATE_BUCKET}"
            else
              aws s3api create-bucket \
                --bucket "${STATE_BUCKET}" \
                --create-bucket-configuration "LocationConstraint=${AWS_REGION}"
            fi
          fi

          aws s3api put-public-access-block \
            --bucket "${STATE_BUCKET}" \
            --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          aws s3api put-bucket-ownership-controls \
            --bucket "${STATE_BUCKET}" \
            --ownership-controls '{"Rules":[{"ObjectOwnership":"BucketOwnerEnforced"}]}'
          aws s3api put-bucket-versioning \
            --bucket "${STATE_BUCKET}" \
            --versioning-configuration Status=Enabled
          aws s3api put-bucket-encryption \
            --bucket "${STATE_BUCKET}" \
            --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"aws:kms"},"BucketKeyEnabled":true}]}'

          cat > /tmp/state-bucket-policy.json <<JSON
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "DenyInsecureTransport",
                "Effect": "Deny",
                "Principal": "*",
                "Action": "s3:*",
                "Resource": [
                  "arn:${PARTITION}:s3:::${STATE_BUCKET}",
                  "arn:${PARTITION}:s3:::${STATE_BUCKET}/*"
                ],
                "Condition": {
                  "Bool": {
                    "aws:SecureTransport": "false"
                  }
                }
              },
              {
                "Sid": "DenyOutdatedTLS",
                "Effect": "Deny",
                "Principal": "*",
                "Action": "s3:*",
                "Resource": [
                  "arn:${PARTITION}:s3:::${STATE_BUCKET}",
                  "arn:${PARTITION}:s3:::${STATE_BUCKET}/*"
                ],
                "Condition": {
                  "NumericLessThan": {
                    "s3:TlsVersion": 1.2
                  }
                }
              }
            ]
          }
          JSON
          aws s3api put-bucket-policy --bucket "${STATE_BUCKET}" --policy file:///tmp/state-bucket-policy.json

          if ! aws dynamodb describe-table --table-name "${LOCK_TABLE}" >/dev/null 2>&1; then
            aws dynamodb create-table \
              --table-name "${LOCK_TABLE}" \
              --billing-mode PAY_PER_REQUEST \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH
          fi
          aws dynamodb wait table-exists --table-name "${LOCK_TABLE}"
          pitr_status="$(aws dynamodb describe-continuous-backups \
            --table-name "${LOCK_TABLE}" \
            --query 'ContinuousBackupsDescription.PointInTimeRecoveryDescription.PointInTimeRecoveryStatus' \
            --output text 2>/dev/null || true)"
          if [[ "${pitr_status}" != "ENABLED" ]]; then
            aws dynamodb update-continuous-backups \
              --table-name "${LOCK_TABLE}" \
              --point-in-time-recovery-specification PointInTimeRecoveryEnabled=true >/dev/null
          fi

          sse_type="$(aws dynamodb describe-table \
            --table-name "${LOCK_TABLE}" \
            --query 'Table.SSEDescription.SSEType' \
            --output text 2>/dev/null || true)"
          if [[ "${sse_type}" != "KMS" ]]; then
            aws dynamodb update-table \
              --table-name "${LOCK_TABLE}" \
              --sse-specification Enabled=true,SSEType=KMS >/dev/null
            aws dynamodb wait table-exists --table-name "${LOCK_TABLE}"
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ steps.context.outputs.state_bucket }}" \
            -backend-config="key=${{ steps.context.outputs.state_key }}" \
            -backend-config="region=${{ inputs.aws_region }}" \
            -backend-config="dynamodb_table=${{ steps.context.outputs.lock_table }}" \
            -backend-config="encrypt=true"

      - name: Terraform format
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set +e
          terraform plan \
            -var-file="envs/${{ inputs.environment }}.tfvars" \
            -var="aws_region=${{ inputs.aws_region }}" \
            -var="gateway_image_tag=${{ steps.context.outputs.image_tag }}" \
            -var="processor_image_tag=${{ steps.context.outputs.image_tag }}" \
            -input=false \
            -lock-timeout=5m \
            -detailed-exitcode \
            -out=tfplan
          exit_code=$?
          set -e

          if [[ "${exit_code}" -eq 0 ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          elif [[ "${exit_code}" -eq 2 ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            exit "${exit_code}"
          fi

      - name: Upload plan
        if: steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan-${{ inputs.environment }}
          path: ${{ env.TF_DIR }}/tfplan
          retention-days: 1

  apply:
    name: Apply
    needs: plan
    if: inputs.terraform_action == 'apply'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout infra
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Validate deployment region
        shell: bash
        env:
          AWS_REGION: ${{ inputs.aws_region }}
        run: |
          set -euo pipefail

          if [[ "${AWS_REGION}" != "us-west-2" ]]; then
            echo "::error::FSAMP deployments are restricted to us-west-2. Requested: ${AWS_REGION}"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ needs.plan.outputs.state_bucket }}" \
            -backend-config="key=${{ needs.plan.outputs.state_key }}" \
            -backend-config="region=${{ inputs.aws_region }}" \
            -backend-config="dynamodb_table=${{ needs.plan.outputs.lock_table }}" \
            -backend-config="encrypt=true"

      - name: Create ECR repositories
        if: inputs.deploy_images
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform apply \
            -target=module.security \
            -target=module.ecr \
            -var-file="envs/${{ inputs.environment }}.tfvars" \
            -var="aws_region=${{ inputs.aws_region }}" \
            -var="gateway_image_tag=${{ needs.plan.outputs.image_tag }}" \
            -var="processor_image_tag=${{ needs.plan.outputs.image_tag }}" \
            -input=false \
            -lock-timeout=5m \
            -auto-approve

      - name: Resolve ECR repositories
        id: ecr
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          ecr_json="$(terraform output -json ecr_repository_urls)"
          gateway_repository="$(jq -r '.gateway' <<< "${ecr_json}")"
          processor_repository="$(jq -r '.processor' <<< "${ecr_json}")"

          if [[ -z "${gateway_repository}" || "${gateway_repository}" == "null" ]]; then
            echo "Gateway ECR repository was not created."
            exit 1
          fi
          if [[ -z "${processor_repository}" || "${processor_repository}" == "null" ]]; then
            echo "Processor ECR repository was not created."
            exit 1
          fi

          {
            echo "gateway_repository=${gateway_repository}"
            echo "processor_repository=${processor_repository}"
          } >> "$GITHUB_OUTPUT"

      - name: Check image tags
        id: images
        shell: bash
        env:
          GATEWAY_REPOSITORY: ${{ steps.ecr.outputs.gateway_repository }}
          PROCESSOR_REPOSITORY: ${{ steps.ecr.outputs.processor_repository }}
          IMAGE_TAG: ${{ needs.plan.outputs.image_tag }}
          DEPLOY_IMAGES: ${{ inputs.deploy_images }}
        run: |
          set -euo pipefail

          image_exists() {
            local repository_url="$1"
            local repository_name="${repository_url##*/}"

            aws ecr describe-images \
              --repository-name "${repository_name}" \
              --image-ids "imageTag=${IMAGE_TAG}" \
              --query 'imageDetails[0].imageDigest' \
              --output text 2>/dev/null
          }

          gateway_exists=false
          processor_exists=false

          gateway_digest="$(image_exists "${GATEWAY_REPOSITORY}" || true)"
          processor_digest="$(image_exists "${PROCESSOR_REPOSITORY}" || true)"

          if [[ -n "${gateway_digest}" && "${gateway_digest}" != "None" ]]; then
            gateway_exists=true
          fi
          if [[ -n "${processor_digest}" && "${processor_digest}" != "None" ]]; then
            processor_exists=true
          fi

          if [[ "${DEPLOY_IMAGES}" != "true" ]]; then
            if [[ "${gateway_exists}" != "true" ]]; then
              echo "::error::deploy_images=false requires an existing gateway image tag: ${IMAGE_TAG}"
              exit 1
            fi
            if [[ "${processor_exists}" != "true" ]]; then
              echo "::error::deploy_images=false requires an existing processor image tag: ${IMAGE_TAG}"
              exit 1
            fi
          fi

          {
            echo "gateway_exists=${gateway_exists}"
            echo "processor_exists=${processor_exists}"
            echo "gateway_digest=${gateway_digest}"
            echo "processor_digest=${processor_digest}"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token
        if: inputs.deploy_images && (steps.images.outputs.gateway_exists != 'true' || steps.images.outputs.processor_exists != 'true')
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GABRBA_APPID }}
          private-key: ${{ secrets.GABRBA_SECRET }}
          owner: ${{ github.repository_owner }}
          repositories: |
            fsamp-gateway
            fsamp-processor

      - name: Checkout gateway
        if: inputs.deploy_images && steps.images.outputs.gateway_exists != 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.repository_owner }}/fsamp-gateway
          ref: ${{ inputs.gateway_ref }}
          token: ${{ steps.app-token.outputs.token }}
          path: services/gateway

      - name: Checkout processor
        if: inputs.deploy_images && steps.images.outputs.processor_exists != 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.repository_owner }}/fsamp-processor
          ref: ${{ inputs.processor_ref }}
          token: ${{ steps.app-token.outputs.token }}
          path: services/processor

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@fa648b43de3d4d023bcb3f89ed6940096949c419 # v2

      - name: Set up Docker Buildx
        if: inputs.deploy_images && (steps.images.outputs.gateway_exists != 'true' || steps.images.outputs.processor_exists != 'true')
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build and push gateway image
        id: gateway-build
        if: inputs.deploy_images && steps.images.outputs.gateway_exists != 'true'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: services/gateway
          file: services/gateway/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.gateway_repository }}:${{ needs.plan.outputs.image_tag }}
          provenance: true
          sbom: true

      - name: Build and push processor image
        id: processor-build
        if: inputs.deploy_images && steps.images.outputs.processor_exists != 'true'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: services/processor
          file: services/processor/Dockerfile.lambda
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.processor_repository }}:${{ needs.plan.outputs.image_tag }}
          provenance: true
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign and verify gateway image
        id: gateway-sign
        if: inputs.deploy_images
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "true"
          IMAGE_REPOSITORY: ${{ steps.ecr.outputs.gateway_repository }}
          BUILT_DIGEST: ${{ steps.gateway-build.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.images.outputs.gateway_digest }}
        run: |
          set -euo pipefail

          digest="${BUILT_DIGEST:-${EXISTING_DIGEST:-}}"
          if [[ -z "${digest}" || "${digest}" == "None" ]]; then
            echo "::error::Gateway image digest could not be resolved."
            exit 1
          fi

          image_ref="${IMAGE_REPOSITORY}@${digest}"
          cosign sign --yes "${image_ref}"
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository_owner }}/.+" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${image_ref}" >/dev/null
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Verify existing gateway image
        id: gateway-verify
        if: ${{ !inputs.deploy_images }}
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "true"
          IMAGE_REPOSITORY: ${{ steps.ecr.outputs.gateway_repository }}
          DIGEST: ${{ steps.images.outputs.gateway_digest }}
        run: |
          set -euo pipefail

          if [[ -z "${DIGEST}" || "${DIGEST}" == "None" ]]; then
            echo "::error::Gateway image digest could not be resolved."
            exit 1
          fi

          image_ref="${IMAGE_REPOSITORY}@${DIGEST}"
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository_owner }}/.+" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${image_ref}" >/dev/null
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Sign and verify processor image
        id: processor-sign
        if: inputs.deploy_images
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "true"
          IMAGE_REPOSITORY: ${{ steps.ecr.outputs.processor_repository }}
          BUILT_DIGEST: ${{ steps.processor-build.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.images.outputs.processor_digest }}
        run: |
          set -euo pipefail

          digest="${BUILT_DIGEST:-${EXISTING_DIGEST:-}}"
          if [[ -z "${digest}" || "${digest}" == "None" ]]; then
            echo "::error::Processor image digest could not be resolved."
            exit 1
          fi

          image_ref="${IMAGE_REPOSITORY}@${digest}"
          cosign sign --yes "${image_ref}"
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository_owner }}/.+" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${image_ref}" >/dev/null
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Verify existing processor image
        id: processor-verify
        if: ${{ !inputs.deploy_images }}
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "true"
          IMAGE_REPOSITORY: ${{ steps.ecr.outputs.processor_repository }}
          DIGEST: ${{ steps.images.outputs.processor_digest }}
        run: |
          set -euo pipefail

          if [[ -z "${DIGEST}" || "${DIGEST}" == "None" ]]; then
            echo "::error::Processor image digest could not be resolved."
            exit 1
          fi

          image_ref="${IMAGE_REPOSITORY}@${DIGEST}"
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository_owner }}/.+" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${image_ref}" >/dev/null
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Terraform apply
        id: apply
        working-directory: ${{ env.TF_DIR }}
        run: |
          current_tag="$(aws ssm get-parameter \
            --name "/fsamp/${{ inputs.environment }}/deployment/current_image_tag" \
            --query Parameter.Value \
            --output text 2>/dev/null || true)"

          if [[ -n "${current_tag}" && "${current_tag}" != "None" ]]; then
            aws ssm put-parameter \
              --name "/fsamp/${{ inputs.environment }}/deployment/previous_image_tag" \
              --type String \
              --value "${current_tag}" \
              --overwrite >/dev/null
          fi

          terraform plan \
            -var-file="envs/${{ inputs.environment }}.tfvars" \
            -var="aws_region=${{ inputs.aws_region }}" \
            -var="gateway_image_tag=${{ needs.plan.outputs.image_tag }}" \
            -var="processor_image_tag=${{ needs.plan.outputs.image_tag }}" \
            -var="gateway_image_digest=${{ steps.gateway-sign.outputs.digest || steps.gateway-verify.outputs.digest }}" \
            -var="processor_image_digest=${{ steps.processor-sign.outputs.digest || steps.processor-verify.outputs.digest }}" \
            -input=false \
            -lock-timeout=5m \
            -out=tfplan
          terraform apply -auto-approve -input=false tfplan

      - name: Verify ECS service
        working-directory: ${{ env.TF_DIR }}
        run: |
          cluster="$(terraform output -raw ecs_cluster_name)"
          service="$(terraform output -raw gateway_service_name)"
          aws ecs wait services-stable \
            --cluster "${cluster}" \
            --services "${service}" \
            --region "${{ inputs.aws_region }}"

      - name: Verify Lambda function
        working-directory: ${{ env.TF_DIR }}
        run: |
          function_name="$(terraform output -raw processor_lambda_name)"
          aws lambda wait function-active-v2 \
            --function-name "${function_name}" \
            --region "${{ inputs.aws_region }}"

      - name: Record deployment tag
        if: success()
        run: |
          aws ssm put-parameter \
            --name "/fsamp/${{ inputs.environment }}/deployment/current_image_tag" \
            --type String \
            --value "${{ needs.plan.outputs.image_tag }}" \
            --overwrite >/dev/null

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Deployment Summary"
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Environment | \`${{ inputs.environment }}\` |"
            echo "| Region | \`${{ inputs.aws_region }}\` |"
            echo "| AWS account | \`${{ needs.plan.outputs.account_id }}\` |"
            echo "| Image tag | \`${{ needs.plan.outputs.image_tag }}\` |"
            echo "| Gateway digest | \`${{ steps.gateway-sign.outputs.digest || steps.gateway-verify.outputs.digest || 'not-resolved' }}\` |"
            echo "| Processor digest | \`${{ steps.processor-sign.outputs.digest || steps.processor-verify.outputs.digest || 'not-resolved' }}\` |"
            echo "| State bucket | \`${{ needs.plan.outputs.state_bucket }}\` |"
            echo "| Gateway ref | \`${{ inputs.gateway_ref }}\` |"
            echo "| Processor ref | \`${{ inputs.processor_ref }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
