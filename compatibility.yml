current:
  gateway: "0.0.23"
  processor: "0.0.27"
  # Latest tested, tagged fsamp-event-schema release. The release workflow
  # updates this independently from the wire contract patch version below.
  event-schema: "1.2.0"
  # Wire value carried in schemaVersion. Update it only with the canonical
  # schema, both producers/consumers, and the cross-repository E2E evidence.
  event-contract: "1.2.0"
  infra: "0.0.30"
  code-ci: "0.0.82"

compatibility:
  gateway:
    processor: ">=0.0.26"
    event-schema: ">=1.2.0,<1.3.0"

  processor:
    gateway: ">=0.0.22"
    event-schema: ">=1.2.0,<1.3.0"

breaking-changes:
  - date: "2026-07-11"
    service: event-schema
    version: "1.2.0"
    description: "Schema 1.2.0 is required end-to-end; outbox records use aggregate-scoped PKs and 16 status shards for deterministic recovery."
    affected:
      - gateway: "<0.0.22"
      - processor: "<0.0.26"

  - date: "2026-05-15"
    service: event-schema
    version: "1.1.0"
    description: "Required schemaVersion=1.1.2 const, fileId/eventId/correlationId UUIDv4, securityContext.kmsKeyId ARN pattern, AES/GCM/NoPadding only, SHA-256 checksum required"
    affected:
      - gateway: "<0.0.5"
      - processor: "<0.0.9"

  - date: "2025-12-15"
    service: event-schema
    version: "0.0.7"
    description: "Added securityContext.keyRotationId field"
    affected:
      - gateway: "<0.0.4"
      - processor: "<0.0.5"

  - date: "2025-11-01"
    service: processor
    version: "0.0.4"
    description: "Changed DynamoDB schema to PK/SK pattern"
    affected:
      - gateway: "<0.0.3"

e2e:
  strategy: "new-vs-stable"

  nightly-matrix:
    - gateway: "current"
      processor: "current"
    - gateway: "current"
      processor: "minimum"
    - gateway: "minimum"
      processor: "current"
