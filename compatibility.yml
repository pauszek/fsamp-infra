current:
  gateway: "0.0.4"
  processor: "0.0.6"
  event-schema: "0.0.8"

compatibility:
  gateway:
    processor: "0.0.4"
    event-schema: "0.0.7"
  
  processor:
    gateway: "0.0.3"
    event-schema: "0.0.7"

breaking-changes:
  - date: "2025-12-15"
    service: event-schema
    version: "0.0.7"
    description: "Added securityContext.keyRotationId field"
    affected:
      - gateway: "0.0.3"
      - processor: "0.0.4"
  
  - date: "2025-11-01"
    service: processor
    version: "0.0.4"
    description: "Changed DynamoDB schema to PK/SK pattern"
    affected:
      - gateway: "0.0.2"

e2e:
  strategy: "new-vs-stable"
  
  nightly-matrix:
    - gateway: "current"
      processor: "current"
    - gateway: "current"
      processor: "minimum"
    - gateway: "minimum"
      processor: "current"
