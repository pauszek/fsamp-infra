skip-check:
  - CKV_AWS_144  # S3 cross-region replication is out of thesis/free-tier scope
  - CKV_AWS_145  # S3 KMS encryption is configured by module; false positive on derived buckets
  - CKV_AWS_18   # S3 access logging adds cost; CloudTrail data events cover audit demo
  - CKV_AWS_21   # S3 versioning is enabled where needed; false positive on generated module paths
  - CKV_AWS_19   # S3 encryption is enabled with KMS; false positive on generated module paths
  - CKV2_AWS_62  # Lambda async DLQ is not applicable to SQS event source flow
  - CKV_AWS_116  # Lambda DLQ is configured for processor; false positive on container Lambda
  - CKV_AWS_173  # Lambda environment encryption uses the project KMS key
  - CKV_AWS_50   # X-Ray tracing is enabled for API/Lambda paths; ECS app tracing remains optional
  - CKV_AWS_59   # Public /health is intentional for load balancer/API health checks; business routes use Cognito
  - CKV_AWS_120  # API Gateway response caching is out of scope/costly for upload APIs
  - CKV_AWS_225  # API method caching intentionally disabled for dynamic upload/status flows
  - CKV_AWS_91   # Private internal ALB access logs are documented as a production add-on to avoid dev storage cost
  - CKV_AWS_378  # TLS terminates at the ALB FIPS listener; ALB->task HTTP:8080 stays on private-subnet ENIs governed by SGs (SC-7)
  - CKV2_AWS_51  # Client certificate auth not used; API auth uses Cognito JWT + WAF for thesis scope
  - CKV2_AWS_77  # WAF includes AWSManagedRulesKnownBadInputsRuleSet; Checkov does not detect this module shape
  - CKV2_AWS_5   # Security groups are attached through cross-module ECS/Lambda/ALB references; Checkov false positive
  - CKV2_AWS_6   # S3 public access blocks are created via for_each; Checkov relation check false positive
  - CKV2_AWS_1   # NACLs are attached via subnet_ids on aws_network_acl; Checkov relation check false positive
  - CKV_AWS_231  # NACL ephemeral response ranges are intentional; no explicit RDP rule exists
  - CKV2_AWS_3   # Organization-wide GuardDuty delegation is outside single-account thesis/free-tier scope

framework:
  - terraform

download-external-modules: true

compact: true

output:
  - cli

directory:
  - terraform/
